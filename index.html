<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>モンスターバトル</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #eef4ff, #fff7e8);
    overflow: hidden;
    color: #243044;
  }
  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 8px;
    padding: 8px;
    max-width: 760px;
    margin: 0 auto;
  }
  .card {
    background: rgba(255,255,255,.95);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 8px 20px rgba(80,90,130,.12);
    overflow: hidden;
  }
  h1 { margin: 0; font-size: 20px; }
  h2 { margin: 0 0 8px; font-size: 15px; }
  .team {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    max-height: 142px;
    overflow: auto;
  }
  .monster {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: #f3f7ff;
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 6px;
    text-align: center;
    cursor: pointer;
    min-height: 76px;
  }
  .monster.active { border-color: #2563eb; background: #dbeafe; }
  .icon { font-size: 28px; line-height: 1; }
  .name { font-weight: 800; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small { font-size: 10px; color: #667085; }
  .battle {
    display: grid;
    grid-template-columns: 1fr 40px 1fr;
    align-items: center;
    text-align: center;
    gap: 6px;
    min-height: 0;
  }
  .fighter {
    position: relative;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .big { font-size: 54px; line-height: 1; }
  .vs { font-size: 20px; font-weight: 900; color: #ef4444; }
  .hpbar {
    height: 12px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin: 8px 0 4px;
  }
  .hpfill { height: 100%; background: linear-gradient(90deg, #22c55e, #84cc16); transition: width .25s; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    border: none;
    border-radius: 16px;
    min-height: 58px;
    font-size: 18px;
    font-weight: 900;
    color: white;
    background: #2563eb;
    cursor: pointer;
    padding: 12px;
    touch-action: manipulation;
  }
  button.secondary { background: #64748b; }
  button.danger { background: #dc2626; }
  button.stop {
    background: #e11d48;
    min-height: 86px;
    font-size: 28px;
    width: 100%;
    box-shadow: 0 10px 24px rgba(225,29,72,.35);
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .log {
    margin-top: 8px;
    background: #111827;
    color: white;
    border-radius: 12px;
    padding: 8px;
    height: 78px;
    overflow: auto;
    font-size: 12px;
    line-height: 1.45;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
  }
  .modal.show { display: flex; }
  .modal-card {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 22px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 92vh;
    overflow: auto;
  }
  .roulette { font-size: 48px; font-weight: 900; margin: 8px 0; color: #e11d48; }
  .tap {
    width: 100%;
    min-height: 120px;
    font-size: 40px;
    background: orange;
  }
  .damage-pop {
    position: absolute;
    left: 50%;
    top: 20px;
    transform: translateX(-50%);
    color: #ef4444;
    font-size: 30px;
    font-weight: 900;
    animation: pop .8s ease forwards;
    pointer-events: none;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); }
    25% { opacity: 1; transform: translate(-50%, -8px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -50px) scale(1); }
  }
  .shake { animation: shake .35s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-5px); }
  }
  .capture-results {
    display: grid;
    gap: 8px;
    text-align: left;
  }
  .capture-result {
    background: #f8fafc;
    border-radius: 12px;
    padding: 10px;
    font-weight: 800;
  }
  .capture-result.success { color: #15803d; }
  .capture-result.fail { color: #b91c1c; }
  .qr-input {
    width: 100%;
    min-height: 120px;
    border: 2px solid #bfdbfe;
    border-radius: 14px;
    padding: 10px;
    font-size: 14px;
    resize: vertical;
  }
  .camera-preview {
    width: 100%;
    max-height: 260px;
    background: #111827;
    border-radius: 16px;
    display: none;
    object-fit: cover;
  }
  .camera-preview.show {
    display: block;
  }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>モンスターバトル</h1>
    <h2>自分のチームを3体選んでください</h2>
    <div class="controls" style="margin-bottom:8px;">
      <button id="openQrBtn" class="secondary">QR内容で追加</button>
    </div>
    <div id="team" class="team"></div>
  </div>

  <div class="card battle">
    <div id="playerBox" class="fighter">
      <div id="playerIcon" class="big">❔</div>
      <div id="playerName" class="name">未選択</div>
      <div class="hpbar"><div id="playerHp" class="hpfill" style="width:0%"></div></div>
      <div id="playerHpText" class="small">HP -</div>
    </div>

    <div class="vs">VS</div>

    <div id="enemyBox" class="fighter">
      <div id="enemyIcon" class="big">❔</div>
      <div id="enemyName" class="name">相手</div>
      <div class="hpbar"><div id="enemyHp" class="hpfill" style="width:100%"></div></div>
      <div id="enemyHpText" class="small">HP -</div>
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <button id="attackBtn">攻撃</button>
      <button id="changeBtn" class="secondary">交代</button>
      <button id="resetBtn" class="danger">リセット</button>
    </div>
    <div id="log" class="log"></div>
  </div>
</div>

<div id="tapModal" class="modal">
  <div class="modal-card">
    <h2>10秒連打！</h2>
    <p>多く押すほど先攻になりやすい！</p>
    <div id="tapTime" class="roulette">10</div>
    <button id="tapBtn" class="tap">TAP!!</button>
    <p id="tapCount">0 TAP</p>
  </div>
</div>

<div id="rouletteModal" class="modal">
  <div class="modal-card">
    <h2>攻撃アップルーレット</h2>
    <div id="roulette" class="roulette">+0</div>
    <button id="stopBtn" class="stop">止める！</button>
  </div>
</div>

<div id="messageModal" class="modal">
  <div class="modal-card">
    <h2 id="messageTitle">結果</h2>
    <p id="messageBody"></p>
    <button id="messageOk" style="min-height:78px;font-size:28px;width:100%;box-shadow:0 10px 24px rgba(37,99,235,.35);">OK</button>
  </div>
</div>

<div id="captureModal" class="modal">
  <div class="modal-card">
    <h2>捕獲チャンス！</h2>
    <p>勝利した相手3体にボールを投げられます。</p>
    <div id="ballRoulette" class="roulette">🔴 モンスターボール</div>
    <button id="startCaptureBtn">ボールルーレット開始</button>
    <button id="stopCaptureBtn" class="stop" disabled>ボールを決定！</button>
    <div id="captureResults" class="capture-results"></div>
    <button id="closeCaptureBtn" class="secondary">閉じる</button>
  </div>
</div>

<div id="qrModal" class="modal">
  <div class="modal-card">
    <h2>QR内容から追加</h2>
    <p class="small">QRコードの中身を貼り付けてください。JSON形式に対応しています。</p>
    <div id="qrReader" class="camera-preview"></div>
    <button id="startCameraQrBtn" class="secondary">カメラでQR読み込み</button>
    <button id="stopCameraQrBtn" class="danger" style="display:none;">カメラ停止</button>
    <textarea id="qrText" class="qr-input" placeholder='例: {"name":"ピカロン","icon":"⚡","maxHp":220,"atk":75,"speed":90}'></textarea>
    <button id="addQrMonsterBtn">モンスターを追加</button>
    <button id="closeQrBtn" class="secondary">閉じる</button>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
'use strict';

const baseMonsters = [
  { name: 'ゆの', icon: '👧🏻', maxHp: 260, atk: 85, speed: 95 },
  { name: 'びーコロ', icon: '🦫', maxHp: 220, atk: 70, speed: 70 },
  { name: 'リュウバード', icon: '🐉', maxHp: 240, atk: 80, speed: 80 },
  { name: 'ヒノコーン', icon: '🦊', maxHp: 200, atk: 68, speed: 90 },
  { name: 'モフドン', icon: '🐻', maxHp: 250, atk: 75, speed: 55 },
  { name: 'アクアロン', icon: '🐬', maxHp: 210, atk: 72, speed: 75 },
  { name: 'ハッパード', icon: '🦖', maxHp: 230, atk: 82, speed: 60 },
  { name: 'ヤミクラゲ', icon: '🪼', maxHp: 205, atk: 78, speed: 85 }
];

const baseEnemies = [
  { name: 'ガルドン', icon: '🐺', maxHp: 240, atk: 58, speed: 60, rarity: 2 },
  { name: 'ドラグル', icon: '🦖', maxHp: 230, atk: 70, speed: 65, rarity: 4 },
  { name: 'モコロン', icon: '🐻', maxHp: 250, atk: 60, speed: 50, rarity: 2 },
  { name: 'ルミナス', icon: '🦄', maxHp: 210, atk: 66, speed: 78, rarity: 5 },
  { name: 'アクロン', icon: '🐬', maxHp: 220, atk: 62, speed: 72, rarity: 3 }
];

const captureBalls = [
  { name: 'モンスターボール', icon: '🔴', rate: 0.55 },
  { name: 'スーパーボール', icon: '🔵', rate: 0.72 },
  { name: 'ハイパーボール', icon: '🟡', rate: 0.88 },
  { name: 'マスターボール', icon: '🟣', rate: 1.0 }
];

let ownedMonsters = [];
let selectedIndexes = [];
let playerTeam = [];
let enemyTeam = [];
let playerIndex = 0;
let enemyIndex = 0;
let busy = false;
let tapCount = 0;
let rouletteValue = 0;
let rouletteTimer = null;
let stopRouletteResolve = null;
let defeatedEnemies = [];
let captureTimer = null;
let currentBall = captureBalls[0];

const teamEl = document.getElementById('team');
const logEl = document.getElementById('log');
const attackBtn = document.getElementById('attackBtn');
const changeBtn = document.getElementById('changeBtn');
const resetBtn = document.getElementById('resetBtn');
const tapModal = document.getElementById('tapModal');
const tapBtn = document.getElementById('tapBtn');
const tapCountEl = document.getElementById('tapCount');
const tapTimeEl = document.getElementById('tapTime');
const rouletteModal = document.getElementById('rouletteModal');
const rouletteEl = document.getElementById('roulette');
const stopBtn = document.getElementById('stopBtn');
const messageModal = document.getElementById('messageModal');
const messageTitle = document.getElementById('messageTitle');
const messageBody = document.getElementById('messageBody');
const messageOk = document.getElementById('messageOk');
const captureModal = document.getElementById('captureModal');
const ballRoulette = document.getElementById('ballRoulette');
const startCaptureBtn = document.getElementById('startCaptureBtn');
const stopCaptureBtn = document.getElementById('stopCaptureBtn');
const closeCaptureBtn = document.getElementById('closeCaptureBtn');
const openQrBtn = document.getElementById('openQrBtn');
const qrModal = document.getElementById('qrModal');
const qrText = document.getElementById('qrText');
const addQrMonsterBtn = document.getElementById('addQrMonsterBtn');
const closeQrBtn = document.getElementById('closeQrBtn');
const startCameraQrBtn = document.getElementById('startCameraQrBtn');
const stopCameraQrBtn = document.getElementById('stopCameraQrBtn');
const qrReader = document.getElementById('qrReader');
let html5QrCode = null;
let qrScannerRunning = false;
const captureResults = document.getElementById('captureResults');

window.addEventListener('error', function (e) {
  if (logEl) {
    logEl.innerHTML = '<span style="color:#fca5a5">エラー: ' + e.message + '</span><br>' + logEl.innerHTML;
  }
  busy = false;
  renderBattle();
});

function cloneUnit(unit) {
  return { ...unit, hp: unit.maxHp };
}

function log(text) {
  logEl.innerHTML = text + '<br>' + logEl.innerHTML;
}

function show(modal) {
  if (modal) modal.classList.add('show');
}

function hide(modal) {
  if (modal) modal.classList.remove('show');
}

function hideAllModals() {
  hide(tapModal);
  hide(rouletteModal);
  hide(messageModal);
  hide(captureModal);
  hide(qrModal);
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function safeRun(fn) {
  try {
    const result = fn();
    if (result && typeof result.catch === 'function') {
      result.catch(handleError);
    }
  } catch (error) {
    handleError(error);
  }
}

function handleError(error) {
  const message = error && error.message ? error.message : String(error);
  log('エラー: ' + message);
  busy = false;
  hideAllModals();
  renderBattle();
}

function showMessage(title, body) {
  return new Promise(resolve => {
    messageTitle.textContent = title;
    messageBody.innerHTML = body;
    show(messageModal);
    messageOk.onclick = () => {
      hide(messageModal);
      resolve();
    };
  });
}

function currentPlayer() {
  return playerTeam[playerIndex] || null;
}

function currentEnemy() {
  return enemyTeam[enemyIndex] || null;
}

function renderTeamSelector() {
  teamEl.innerHTML = '';
  ownedMonsters.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = 'monster' + (selectedIndexes.includes(i) ? ' active' : '');
    div.innerHTML = '<div class="icon">' + m.icon + '</div><div class="name">' + m.name + '</div><div class="small">攻' + m.atk + ' 速' + m.speed + '</div>';
    div.onclick = () => {
      if (busy) return;
      if (selectedIndexes.includes(i)) {
        selectedIndexes = selectedIndexes.filter(v => v !== i);
      } else {
        if (selectedIndexes.length >= 3) {
          log('3体まで選べます。');
          return;
        }
        selectedIndexes.push(i);
      }
      buildPlayerTeam();
      renderAll();
    };
    teamEl.appendChild(div);
  });
}

function buildPlayerTeam() {
  playerTeam = selectedIndexes.map(i => cloneUnit(ownedMonsters[i])).filter(Boolean);
  playerIndex = Math.min(playerIndex, Math.max(0, playerTeam.length - 1));
}

function buildEnemyTeam() {
  enemyTeam = baseEnemies.slice(0, 3).map(cloneUnit);
  enemyIndex = 0;
}

function hpPercent(unit) {
  if (!unit || !unit.maxHp) return 0;
  return Math.max(0, Math.min(100, unit.hp / unit.maxHp * 100));
}

function renderBattle() {
  const p = currentPlayer();
  const e = currentEnemy();

  document.getElementById('playerIcon').textContent = p ? p.icon : '❔';
  document.getElementById('playerName').textContent = p ? p.name : '未選択';
  document.getElementById('playerHp').style.width = hpPercent(p) + '%';
  document.getElementById('playerHpText').textContent = p ? 'HP ' + p.hp + ' / ' + p.maxHp : 'HP -';

  document.getElementById('enemyIcon').textContent = e ? e.icon : '❔';
  document.getElementById('enemyName').textContent = e ? e.name : '相手なし';
  document.getElementById('enemyHp').style.width = hpPercent(e) + '%';
  document.getElementById('enemyHpText').textContent = e ? 'HP ' + e.hp + ' / ' + e.maxHp : 'HP -';

  attackBtn.disabled = busy || playerTeam.length !== 3 || !p || !e;
  changeBtn.disabled = busy || playerTeam.filter(x => x.hp > 0).length <= 1;
}

function renderAll() {
  renderTeamSelector();
  renderBattle();
}

function nextAliveIndex(team, current) {
  for (let i = current + 1; i < team.length; i++) {
    if (team[i] && team[i].hp > 0) return i;
  }
  for (let i = 0; i < team.length; i++) {
    if (team[i] && team[i].hp > 0) return i;
  }
  return -1;
}

async function startTapBattle() {
  const p = currentPlayer();
  const e = currentEnemy();
  if (!p || !e) return true;

  tapCount = 0;
  let enemyTap = 0;
  let time = 10;
  tapCountEl.textContent = '自分 0 TAP / 相手 0 TAP';
  tapTimeEl.textContent = '10';
  show(tapModal);

  const tapHandler = () => {
    tapCount++;
    tapCountEl.textContent = '自分 ' + tapCount + ' TAP / 相手 ' + enemyTap + ' TAP';
  };
  tapBtn.addEventListener('click', tapHandler);

  const enemyTimer = setInterval(() => {
    if (Math.random() < 0.55) enemyTap++;
    tapCountEl.textContent = '自分 ' + tapCount + ' TAP / 相手 ' + enemyTap + ' TAP';
  }, 180);

  const timeTimer = setInterval(() => {
    time--;
    tapTimeEl.textContent = String(Math.max(0, time));
  }, 1000);

  await wait(10000);

  clearInterval(enemyTimer);
  clearInterval(timeTimer);
  tapBtn.removeEventListener('click', tapHandler);
  hide(tapModal);

  const playerScore = p.speed + tapCount;
  const enemyScore = e.speed + enemyTap;
  const playerFirst = playerScore >= enemyScore;

  await showMessage(playerFirst ? '自分が先攻！' : '相手が先攻！', '自分: ' + playerScore + '<br>相手: ' + enemyScore);
  return playerFirst;
}

function startRoulette() {
  return new Promise(resolve => {
    rouletteValue = 0;
    rouletteEl.textContent = '+0';
    show(rouletteModal);
    stopBtn.disabled = false;

    rouletteTimer = setInterval(() => {
      const values = [0, 10, 20, 30, 50, 80];
      rouletteValue = values[Math.floor(Math.random() * values.length)];
      rouletteEl.textContent = '+' + rouletteValue;
    }, 80);

    stopRouletteResolve = () => {
      clearInterval(rouletteTimer);
      rouletteTimer = null;
      stopBtn.disabled = true;
      hide(rouletteModal);
      resolve(rouletteValue);
    };
  });
}

function damageEffect(targetBox, damage) {
  if (!targetBox) return;
  targetBox.classList.add('shake');
  const pop = document.createElement('div');
  pop.className = 'damage-pop';
  pop.textContent = '-' + damage;
  targetBox.appendChild(pop);
  setTimeout(() => targetBox.classList.remove('shake'), 400);
  setTimeout(() => pop.remove(), 900);
}

function attack(attacker, defender, bonus, attackerIsPlayer) {
  if (!attacker || !defender) return false;

  const damage = Math.max(1, attacker.atk + bonus);
  defender.hp = Math.max(0, defender.hp - damage);
  log(attacker.name + ' の攻撃！ ' + damage + ' ダメージ！');
  renderBattle();
  damageEffect(attackerIsPlayer ? document.getElementById('enemyBox') : document.getElementById('playerBox'), damage);
  return defender.hp <= 0;
}

async function playerDefeatedFlow() {
  const defeated = currentPlayer();
  if (defeated) log(defeated.name + ' は倒れた！');

  const next = nextAliveIndex(playerTeam, playerIndex);
  if (next < 0) {
    await showMessage('敗北…', '自分のチームが全滅しました。');
    busy = false;
    renderBattle();
    return false;
  }

  playerIndex = next;
  renderBattle();
  await showMessage('交代！', currentPlayer().name + ' が出た！');
  return true;
}

async function enemyDefeatedFlow() {
  const defeated = currentEnemy();
  if (defeated) log(defeated.name + ' を倒した！');

  const next = nextAliveIndex(enemyTeam, enemyIndex);
  if (next < 0) {
    defeatedEnemies = enemyTeam.map(e => ({ ...e }));
    await showMessage('勝利！', '相手チームを全員倒しました！<br>捕獲チャンス発生！');
    await showCaptureChance();
    busy = false;
    renderBattle();
    return false;
  }

  enemyIndex = next;
  renderBattle();
  await showMessage('相手が交代！', currentEnemy().name + ' が出た！');
  return true;
}

async function battleTurn() {
  if (busy) return;
  if (playerTeam.length !== 3) {
    await showMessage('確認', '自分のチームを3体選んでください。');
    return;
  }
  if (!currentPlayer() || !currentEnemy()) {
    await showMessage('確認', '戦えるモンスターがいません。リセットしてください。');
    return;
  }

  busy = true;
  renderBattle();

  const playerFirst = await startTapBattle();
  const bonus = await startRoulette();

  if (playerFirst) {
    let defeated = attack(currentPlayer(), currentEnemy(), bonus, true);
    if (defeated) {
      const hasNextEnemy = await enemyDefeatedFlow();
      if (!hasNextEnemy) return;
    }

    await wait(1000);
    defeated = attack(currentEnemy(), currentPlayer(), 0, false);
    if (defeated) {
      await playerDefeatedFlow();
    }
  } else {
    let defeated = attack(currentEnemy(), currentPlayer(), 0, false);
    if (defeated) {
      const hasNextPlayer = await playerDefeatedFlow();
      if (!hasNextPlayer) return;
    }

    await wait(1000);
    defeated = attack(currentPlayer(), currentEnemy(), bonus, true);
    if (defeated) {
      await enemyDefeatedFlow();
    }
  }

  busy = false;
  renderBattle();
}

function getCaptureRate(ball, monster) {
  if (!ball) return 0.3;
  if (ball.name === 'マスターボール') return 1;
  const penalty = monster && monster.rarity ? (monster.rarity - 1) * 0.06 : 0;
  return Math.max(0.25, Math.min(0.97, ball.rate - penalty));
}

function addCapturedMonster(monster) {
  if (!monster) return;
  if (ownedMonsters.some(m => m.name === monster.name)) return;
  ownedMonsters.push({
    name: monster.name,
    icon: monster.icon,
    maxHp: monster.maxHp,
    atk: monster.atk,
    speed: monster.speed
  });
}

function showCaptureChance() {
  return new Promise(resolve => {
    captureResults.innerHTML = '';
    currentBall = captureBalls[0];
    ballRoulette.textContent = currentBall.icon + ' ' + currentBall.name;
    startCaptureBtn.disabled = false;
    stopCaptureBtn.disabled = true;
    closeCaptureBtn.disabled = false;
    show(captureModal);

    closeCaptureBtn.onclick = () => {
      hide(captureModal);
      resolve();
    };
  });
}

function startCaptureRoulette() {
  if (captureTimer) return;
  captureResults.innerHTML = '';
  startCaptureBtn.disabled = true;
  stopCaptureBtn.disabled = false;
  captureTimer = setInterval(() => {
    currentBall = captureBalls[Math.floor(Math.random() * captureBalls.length)];
    ballRoulette.textContent = currentBall.icon + ' ' + currentBall.name;
  }, 90);
}

function stopCaptureRoulette() {
  if (!captureTimer) return;
  clearInterval(captureTimer);
  captureTimer = null;
  stopCaptureBtn.disabled = true;

  captureResults.innerHTML = '';
  defeatedEnemies.forEach(monster => {
    const rate = getCaptureRate(currentBall, monster);
    const success = currentBall.name === 'マスターボール' || Math.random() < rate;
    if (success) addCapturedMonster(monster);

    const div = document.createElement('div');
    div.className = 'capture-result ' + (success ? 'success' : 'fail');
    div.textContent = success
      ? monster.icon + ' ' + monster.name + ' を捕まえた！'
      : monster.icon + ' ' + monster.name + ' は逃げ出した…';
    captureResults.appendChild(div);
  });

  log(currentBall.name + 'で捕獲判定しました。');
  renderAll();
}

function normalizeQrMonster(data) {
  if (!data || typeof data !== 'object') {
    throw new Error('JSONの形式が正しくありません。');
  }

  const name = String(data.name || '').trim();
  const icon = String(data.icon || '❔').trim() || '❔';
  const maxHp = Number(data.maxHp ?? data.hp);
  const atk = Number(data.atk ?? data.attack);
  const speed = Number(data.speed);

  if (!name) throw new Error('name が必要です。');
  if (!Number.isFinite(maxHp) || maxHp <= 0) throw new Error('maxHp または hp は1以上の数値にしてください。');
  if (!Number.isFinite(atk) || atk <= 0) throw new Error('atk または attack は1以上の数値にしてください。');
  if (!Number.isFinite(speed) || speed <= 0) throw new Error('speed は1以上の数値にしてください。');

  return {
    name,
    icon,
    maxHp: Math.floor(maxHp),
    atk: Math.floor(atk),
    speed: Math.floor(speed)
  };
}

function setQrTextAndAdd(text) {
  qrText.value = text;
  addMonsterFromQrText();
}

async function startCameraQrScan() {
  if (!window.Html5Qrcode) {
    log('html5-qrcodeライブラリを読み込めませんでした。インターネット接続を確認してください。');
    return;
  }

  if (qrScannerRunning) return;

  try {
    qrReader.classList.add('show');
    qrReader.style.display = 'block';
    startCameraQrBtn.disabled = true;
    stopCameraQrBtn.style.display = 'block';

    html5QrCode = new Html5Qrcode('qrReader');

    await html5QrCode.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 240, height: 240 }
      },
      async (decodedText) => {
        await stopCameraQrScan();
        log('QRコードを読み込みました。');
        setQrTextAndAdd(decodedText);
      },
      () => {
        // 読み取り失敗フレームは無視
      }
    );

    qrScannerRunning = true;
  } catch (error) {
    log('カメラを起動できませんでした。HTTPSで開くか、カメラ許可を確認してください。');
    await stopCameraQrScan();
  }
}

async function stopCameraQrScan() {
  try {
    if (html5QrCode && qrScannerRunning) {
      await html5QrCode.stop();
      await html5QrCode.clear();
    } else if (html5QrCode) {
      await html5QrCode.clear();
    }
  } catch (error) {
    // 停止時の一時エラーは無視
  }

  html5QrCode = null;
  qrScannerRunning = false;

  if (qrReader) {
    qrReader.innerHTML = '';
    qrReader.classList.remove('show');
    qrReader.style.display = 'none';
  }

  if (startCameraQrBtn) startCameraQrBtn.disabled = false;
  if (stopCameraQrBtn) stopCameraQrBtn.style.display = 'none';
}

function addMonsterFromQrText() {
  const text = qrText.value.trim();
  if (!text) {
    log('QR内容を入力してください。');
    return;
  }

  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (error) {
    log('QR内容のJSONが正しくありません。');
    return;
  }

  try {
    const monster = normalizeQrMonster(parsed);
    if (ownedMonsters.some(m => m.name === monster.name)) {
      log(monster.name + ' はすでに追加されています。');
      return;
    }

    ownedMonsters.push(monster);
    qrText.value = '';
    hide(qrModal);
    renderAll();
    log(monster.icon + ' ' + monster.name + ' を追加しました！');
  } catch (error) {
    log('追加できません: ' + error.message);
  }
}

function changePlayer() {
  if (busy) return;
  const next = nextAliveIndex(playerTeam, playerIndex);
  if (next >= 0) {
    playerIndex = next;
    log(currentPlayer().name + ' に交代した！');
    renderBattle();
  }
}

function resetGame() {
  stopCameraQrScan();
  ownedMonsters = baseMonsters.map(x => ({ ...x }));
  selectedIndexes = [];
  playerTeam = [];
  playerIndex = 0;
  buildEnemyTeam();
  enemyIndex = 0;
  busy = false;
  defeatedEnemies = [];
  if (rouletteTimer) clearInterval(rouletteTimer);
  if (captureTimer) clearInterval(captureTimer);
  rouletteTimer = null;
  captureTimer = null;
  stopRouletteResolve = null;
  logEl.innerHTML = '';
  hideAllModals();
  renderAll();
  log('リセットしました。');
}

attackBtn.onclick = () => safeRun(battleTurn);
changeBtn.onclick = () => safeRun(changePlayer);
resetBtn.onclick = () => safeRun(resetGame);
stopBtn.onclick = () => {
  if (stopRouletteResolve) stopRouletteResolve();
};
startCaptureBtn.onclick = () => safeRun(startCaptureRoulette);
stopCaptureBtn.onclick = () => safeRun(stopCaptureRoulette);
closeCaptureBtn.onclick = () => hide(captureModal);
openQrBtn.onclick = () => show(qrModal);
closeQrBtn.onclick = () => {
  stopCameraQrScan();
  hide(qrModal);
};
startCameraQrBtn.onclick = () => safeRun(startCameraQrScan);
stopCameraQrBtn.onclick = () => safeRun(stopCameraQrScan);
addQrMonsterBtn.onclick = () => safeRun(addMonsterFromQrText);

safeRun(resetGame);
</script>
</body>
</html>
